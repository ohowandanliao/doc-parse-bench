# Same dataset and evaluators as standard; only the preprocessing preset changes.
# Model chart_analysis must already have been enabled when predictions were produced.
profile: legacy
input_format: annotations
backends: [OmniDocBench, MPDocBench]
annotations: ../data/annotations
output: ../artifacts/runs/legacy-preprocessing
jobs: 2
models:
  MinerU:
    adapter: MinerU
    source: ../data/predictions/results/MinerU
  NaviDC-OCR:
    adapter: NaviDC-OCR
    source: ../data/predictions/results/NaviDC-OCR
  OvisOCR2:
    adapter: OvisOCR2
    source: ../data/predictions/results/OvisOCR2
  Unlimited-OCR-2:
    adapter: Unlimited-OCR-2
    source: ../data/predictions/results/Unlimited-OCR-2
