[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "doc-parse-bench"
version = "0.1.0"
description = "Document parsing adapters for OmniDocBench, MPDocBench and historical metrics"
requires-python = ">=3.10,<3.12"
dependencies = [
  "beautifulsoup4>=4.11", "lxml>=4.9", "markdown-it-py>=3",
  "Levenshtein>=0.25", "PyYAML>=6", "pypdfium2>=4",
]

[project.optional-dependencies]
eval = [
  "numpy>=1.24,<2", "pandas>=2,<3", "scipy>=1.10", "matplotlib>=3.7",
  "evaluate==0.4.3", "datasets>=3,<4", "pyarrow>=17,<22", "huggingface-hub<1",
  "nltk>=3.9", "Pillow>=10", "scikit-image>=0.22",
  "rapidfuzz>=3", "apted>=1", "tabulate>=0.9", "func-timeout>=4.3",
  "tqdm>=4.66", "loguru>=0.7", "opencv-python-headless<4.12", "mmeval>=0.2",
  "pylatexenc>=2.10,<3", "requests>=2.32", "langid>=1.1",
  "numba>=0.60,<0.69",
]
dev = ["pytest>=8", "ruff>=0.9"]

[project.scripts]
docbench = "doc_parse_bench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["src/doc_parse_bench/compatibility/engine"]

[tool.setuptools.package-data]
"doc_parse_bench.compatibility.engine" = ["LICENSE", "NOTICE.md"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
